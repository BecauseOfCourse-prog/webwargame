name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check application and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # These credentials belong only to this disposable job's database.
    env:
      DATABASE_URL: postgresql://wargame_ci:ci-only-password@127.0.0.1:5432/wargame_ci

    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: wargame_ci
          POSTGRES_DB: wargame_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wargame_ci -d wargame_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 5s

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js from the repository version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run local application checks
        run: pnpm check

      - name: Apply committed migrations
        run: pnpm db:migrate

      - name: Confirm migration reapplication is safe
        run: pnpm db:migrate

      - name: Check migration status
        run: pnpm db:status

      - name: Test authentication, registration and database network failure handling
        run: pnpm test:database
